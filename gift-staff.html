<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>建達國際 — 員工入口</title>
<style>
:root{
  /* Xander 教育訓練系統配色 */
  --ink:#1a1814;--ink2:#3d3a34;--ink3:#7a7570;
  --paper:#faf9f6;--paper2:#f2f0eb;--paper3:#e8e5de;
  --accent:#e81414;--accent2:#c00f0f;--accent-light:#fef0f0;
  --green:#1a7a3a;--green-light:#e8f5ed;
  --blue:#1a5fa8;--blue-light:#e8f0fb;
  --amber:#8a5a00;--amber-light:#fbf1dd;
  --purple:#5b3ca8;--purple-light:#f0ebfd;
  /* 舊變數別名（相容內嵌 style / JS） */
  --R:#e81414;--RD:#c00f0f;--RL:#fef0f0;--RP:#fde8e8;--RB:#f2d4d4;--RT:#c00f0f;
  --G:#faf9f6;--G2:#f2f0eb;--G3:#e8e5de;--W:#fff;--T:#1a1814;--M:#7a7570;--LT:#b8b3ab;
  --r:8px;--rlg:8px;--rsm:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh}
.page{display:none;flex-direction:column;min-height:100vh}
.page.active{display:flex}
.content{flex:1;padding:1.5rem 1.75rem;max-width:1200px;width:100%;margin:0 auto}

/* Header */
.hdr{background:#fff;border-bottom:1px solid var(--paper3);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.hdr-logo{height:48px;width:auto}
.brand-co{font-size:10px;color:var(--ink3);letter-spacing:.06em}
.brand-ttl{font-size:14px;font-weight:700;color:var(--ink)}
.hdr-btns{display:flex;gap:7px;align-items:center}
.hbtn{background:var(--paper2);border:1px solid var(--paper3);border-radius:var(--r);color:var(--ink2);padding:6px 12px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;font-family:inherit}
.hbtn:hover{background:var(--paper3)}
.avtr{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}

/* Login */
.lhero{background:#fff;border-bottom:1px solid var(--paper3);padding:2.5rem 0 2rem;text-align:center}
.lhero img{height:60px;width:auto;margin-bottom:.75rem}
.lring{display:none}
.lco{font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-bottom:5px}
.lttl{color:var(--ink);font-size:18px;font-weight:700}
.lcardwrap{display:flex;justify-content:center;padding:2rem 1rem 1.5rem}
.lcard{background:#fff;border-radius:var(--rlg);border:1px solid var(--paper3);padding:2rem;width:100%;max-width:370px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.lbadge{text-align:center;margin-bottom:1.25rem;font-size:14px;color:var(--ink);font-weight:700}

/* Inputs */
input,select,textarea{border:1px solid var(--paper3);border-radius:var(--r);padding:9px 13px;font-size:13px;font-family:inherit;color:var(--ink);width:100%;background:var(--paper);outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,20,20,.15)}
label{font-size:12px;font-weight:700;color:var(--ink2);display:block;margin-bottom:4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:var(--r);border:1px solid var(--paper3);background:#fff;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;color:var(--ink2);transition:all .15s}
.btn:hover{background:var(--paper2)}
.btn-r{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-r:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-sm{padding:5px 11px;font-size:12px}

/* Cards */
.card{background:#fff;border:1px solid var(--paper3);border-radius:var(--rlg);overflow:hidden}
.card-hd{background:var(--paper2);padding:11px 16px;border-bottom:1px solid var(--paper3);font-size:13px;font-weight:700;color:var(--ink2)}

/* Stats */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.sgrid3{grid-template-columns:repeat(3,1fr)}
.stat{background:#fff;border-radius:var(--rlg);padding:1.1rem 1.25rem;border:1px solid var(--paper3)}
.stat.acc{border-color:var(--accent);background:var(--accent-light)}
.slbl{font-size:12px;color:var(--ink3);margin-bottom:5px}
.stat.acc .slbl{color:var(--accent2)}
.sval{font-size:1.75rem;font-weight:700;color:var(--ink)}
.stat.acc .sval{color:var(--accent2)}

/* Badges */
.bge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.b-r{background:var(--accent-light);color:var(--accent2)}
.b-g{background:var(--green-light);color:var(--green)}
.b-a{background:var(--amber-light);color:var(--amber)}
.b-b{background:var(--blue-light);color:var(--blue)}
.b-gr{background:var(--paper2);color:var(--ink3)}
.b-t{background:var(--green-light);color:var(--green)}
.b-p{background:var(--purple-light);color:var(--purple)}

/* Table */
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--paper3);border-radius:var(--rlg)}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
th{padding:.65rem 1rem;text-align:center;font-weight:700;font-size:11px;background:var(--paper2);color:var(--ink3);border-bottom:1px solid var(--paper3)}
td{padding:.7rem 1rem;border-bottom:1px solid var(--paper3);vertical-align:middle;text-align:center;color:var(--ink)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--paper)}
.th-sort{cursor:pointer;user-select:none;white-space:nowrap}
.th-sort:hover{color:var(--ink)}

/* Clickable cells */
.cl{display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;border:1.5px dashed;white-space:nowrap}
.cl-fill{background:var(--accent-light);color:var(--accent2);border-color:#f2c0c0}
.cl-fill:hover{background:var(--accent);color:#fff;border-style:solid;border-color:var(--accent)}
.cl-up{background:var(--amber-light);color:var(--amber);border-color:#e3c88a}
.cl-up:hover{background:var(--amber);color:#fff;border-style:solid;border-color:var(--amber)}

/* Modals */
.mover{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem}
.modal{background:#fff;border-radius:var(--rlg);padding:1.5rem;width:100%;border:1px solid var(--paper3);box-shadow:0 10px 40px rgba(0,0,0,.15)}
.msm{max-width:420px}.mmd{max-width:580px}
.mttl{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:1rem}
.frow{margin-bottom:.9rem}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.9rem}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:.9rem}
.mft{display:flex;gap:8px;margin-top:1.25rem}
.mft .btn{flex:1;justify-content:center}
.hlstrip{background:var(--accent-light);border-left:3px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:9px 13px;margin-bottom:1.1rem}

/* Toast */
.toast{position:fixed;top:18px;right:18px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:2000;opacity:0;transform:translateY(-8px);transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}

/* Filters */
.filters{display:flex;gap:7px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.filters input,.filters select{width:auto;flex:1;min-width:100px}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:28px;height:28px;border:3px solid var(--paper3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px}

@media(max-width:640px){
  .sgrid{grid-template-columns:repeat(2,1fr)}
  .fg2,.fg3{grid-template-columns:1fr}
}
</style>
</head>

            <th class="th-sort" data-k="qty" data-label="數量" onclick="sortStaff('qty')">數量</th>
            <th class="th-sort" data-k="price" data-label="價格" onclick="sortStaff('price')">價格</th>
            <th class="th-sort" data-k="purpose" data-label="用途" onclick="sortStaff('purpose')">用途</th>
            <th class="th-sort" data-k="eventDate" data-label="活動日期" onclick="sortStaff('eventDate')">活動日期</th>
            <th>領用單號</th>
            <th class="th-sort" data-k="withhold" data-label="是否扣繳" onclick="sortStaff('withhold')">是否扣繳</th>
            <th class="th-sort" data-k="recvType" data-label="簽收對象" onclick="sortStaff('recvType')">簽收對象</th>
            <th>簽收者名稱</th><th>簽收者ID</th><th>地址</th>
            <th class="th-sort" data-k="receiptDate" data-label="簽收單日期" onclick="sortStaff('receiptDate')">簽收單日期</th>
          </tr></thead>
          <tbody id="staff-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ════ MODALS ════ -->
<div class="mover" id="m-pw" style="display:none" onclick="if(event.target===this)closeM('m-pw')">
  <div class="modal msm">
    <div class="mttl">修改密碼</div>
    <div class="frow"><label>目前密碼</label><input type="text" id="pw-cur"></div>
    <div class="frow"><label>新密碼（至少4位）</label><input type="text" id="pw-new"></div>
    <div class="frow"><label>確認新密碼</label><input type="text" id="pw-cf"></div>
    <div id="pw-err" style="display:none;color:var(--R);font-size:12px;margin-bottom:.75rem;padding:7px 11px;background:var(--RP);border-radius:7px"></div>
    <div class="mft">
      <button class="btn" onclick="closeM('m-pw')">取消</button>
      <button class="btn btn-r" onclick="doChangePw()">確認修改</button>
    </div>
  </div>
</div>

<div class="mover" id="m-claim" style="display:none" onclick="if(event.target===this)closeM('m-claim')">
  <div class="modal msm">
    <div class="mttl">填寫領用單號</div>
    <div class="hlstrip"><div id="cl-name" style="font-weight:500;color:var(--RD);font-size:14px"></div><div id="cl-item" style="font-size:12px;color:var(--M);margin-top:2px"></div></div>
    <div class="frow"><label>領用單號 <span style="color:var(--R)">*</span></label><input id="cl-input" placeholder="輸入領用單號"></div>
    <div class="mft">
      <button class="btn" onclick="closeM('m-claim')">取消</button>
      <button class="btn btn-r" onclick="saveClaim()">儲存</button>
    </div>
  </div>
</div>

<div class="mover" id="m-recv" style="display:none" onclick="if(event.target===this)closeM('m-recv')">
  <div class="modal mmd">
    <div class="mttl">上傳簽收資料</div>
    <div class="hlstrip"><div id="rv-name" style="font-weight:500;color:var(--RD);font-size:14px"></div><div id="rv-item" style="font-size:12px;color:var(--M);margin-top:2px"></div></div>
    <div class="fg3">
      <div><label>簽收對象</label>
        <select id="rv-type" onchange="toggleAddr()"><option value="">請選擇</option><option>公司</option><option>個人</option></select>
      </div>
      <div><label>是否扣繳</label><select id="rv-wh"><option value="">請選擇</option><option>是</option><option>否</option></select></div>
      <div><label>簽收單日期</label><input type="date" id="rv-date"></div>
    </div>
    <div class="fg2">
      <div><label>簽收者名稱</label><input id="rv-nm" placeholder="公司全名 或 個人姓名"></div>
      <div><label>簽收者ID</label><input id="rv-id" placeholder="統一編號 或 身分證字號"></div>
    </div>
    <div id="rv-addr-row" class="frow" style="display:none">
      <label>簽收者戶籍地址（個人簽收）</label><input id="rv-addr" placeholder="請填寫戶籍地址">
    </div>
    <div class="frow">
      <label>簽收單電子檔</label>
      <label style="display:flex;align-items:center;gap:10px;border:1.5px dashed var(--RB);border-radius:9px;padding:11px 14px;cursor:pointer;background:var(--RL)">
        <div><p id="rv-flbl" style="font-size:13px;color:var(--RD);font-weight:500;margin:0">點擊上傳簽收單</p><p style="font-size:11px;color:var(--M);margin:2px 0 0">支援 PDF、JPG、PNG</p></div>
        <input type="file" accept=".pdf,.jpg,.png" style="display:none" onchange="selRecvFile(this)">
      </label>
    </div>
    <div class="mft">
      <button class="btn" onclick="closeM('m-recv')">取消</button>
      <button class="btn btn-r" onclick="saveRecv()">儲存</button>
    </div>
  </div>
</div>

<div id="loading" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:3000;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:18px 26px;text-align:center;min-width:130px">
    <div class="spinner"></div>
    <p id="load-msg" style="font-size:13px;color:var(--RD);font-weight:500"></p>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════
//  Supabase Edge Function「api」網址
// ════════════════════════════════════════════════════
const GAS = 'https://vyaednusponoifaoqniq.supabase.co/functions/v1/api';

function normalize(r){
  if (r && r.ok !== undefined) return r;
  if (r && r.success !== undefined) return { ok:r.success, err:r.error||r.err, user:r.user, data:r.data, sent:r.sent };
  return { ok:false, err:'回傳格式錯誤：'+JSON.stringify(r) };
}
async function GET(params){
  const url = GAS + '?' + new URLSearchParams(params);
  const raw = await fetch(url, {mode:'cors'});
  if(!raw.ok) throw new Error('HTTP '+raw.status+' '+raw.statusText);
  return normalize(JSON.parse(await raw.text()));
}
async function POST(body){
  const raw = await fetch(GAS, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body) });
  if(!raw.ok) throw new Error('HTTP '+raw.status+' '+raw.statusText);
  return normalize(JSON.parse(await raw.text()));
}

// ── 狀態 / 工具 ──────────────────────────────────────
let CU=null, GIFTS=[], EDIT_SEQ=null, RECV_FILE=null;
const SO = { '待填寫':0,'待上傳':1,'待簽收':2,'完成':3 };

function calcStat(g){
  if (!g.claimNo)     return '待填寫';
  if (!g.receiptFile) return '待上傳';
  if (!g.receiptDate) return '待簽收';
  return '完成';
}
function pg(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById('pg-'+id).classList.add('active'); }
function openM(id){ document.getElementById(id).style.display='flex'; }
function closeM(id){ document.getElementById(id).style.display='none'; }
function toast(msg){ const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800); }
function load(show,msg='載入中...'){ const el=document.getElementById('loading');el.style.display=show?'flex':'none';if(show)document.getElementById('load-msg').textContent=msg; }
function f2b64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);})}
function d(v){return(v===''||v===null||v===undefined)?'<span style="color:var(--LT)">—</span>':v}
function toggleEye(btn,inp){const i=document.getElementById(inp);i.type=i.type==='text'?'password':'text';}
function pbge(p){return`<span class="bge ${p==='尾牙'?'b-r':'b-t'}">${p||''}</span>`}
function sbge(s){const m={'完成':'b-g','待填寫':'b-r','待簽收':'b-a','待上傳':'b-b'};return`<span class="bge ${m[s]||'b-gr'}">${s}</span>`}
function lbge(l){const m={'A':'b-r','B':'b-a','C':'b-b'};return l?`<span class="bge ${m[l]||'b-gr'}">${l}</span>`:''}
function rbge(t){return t?`<span class="bge ${t==='公司'?'b-b':'b-p'}">${t}</span>`:'<span style="color:var(--LT)">—</span>'}

// ── 登入（員工）─────────────────────────────────────
async function doLogin(){
  const id=document.getElementById('lid').value.trim();
  const pw=document.getElementById('lpw').value;
  if(!id||!pw){showErr('請輸入帳號與密碼');return;}
  load(true,'驗證中...');
  let res;
  try { res = await GET({action:'login', id, pw, adm:'0'}); }
  catch(e){ load(false); showErr('網路錯誤：'+e.message); return; }
  load(false);
  if(!res.ok){ showErr(res.err||'登入失敗'); return; }
  if(res.user && res.user.role==='admin'){ showErr('此為管理者帳號，請改用管理者後台登入'); return; }
  document.getElementById('lerr').style.display='none';
  CU = res.user;
  CU.email = (CU.email||'').trim().toLowerCase();
  await initStaff(); pg('staff');
}
function showErr(msg){const e=document.getElementById('lerr');e.textContent=msg;e.style.display='block';}
async function forgotPw(){
  let id=document.getElementById('lid').value.trim();
  if(!id) id=(prompt('請輸入您的員工編號')||'').trim();
  if(!id) return;
  if(!confirm('系統將把「'+id+'」的登入密碼寄到您登記的公司信箱。確定嗎？')) return;
  load(true,'處理中...');
  let res;
  try{ res=await POST({action:'forgotPassword',id}); }
  catch(e){ load(false); showErr('網路錯誤：'+e.message); return; }
  load(false);
  if(!res.ok){ showErr(res.err||'處理失敗'); return; }
  document.getElementById('lerr').style.display='none';
  alert('密碼已寄至 '+(res.mask||'您登記的公司信箱')+'\n\n請收信後登入。');
}
function logout(){CU=null;GIFTS=[];document.getElementById('lpw').value='';pg('login');}

// ── 修改密碼 ────────────────────────────────────────
function openPw(){['pw-cur','pw-new','pw-cf'].forEach(i=>document.getElementById(i).value='');document.getElementById('pw-err').style.display='none';openM('m-pw');}
async function doChangePw(){
  const cur=document.getElementById('pw-cur').value;
  const nw=document.getElementById('pw-new').value;
  const cf=document.getElementById('pw-cf').value;
  const err=document.getElementById('pw-err');
  if(nw.length<4){err.textContent='新密碼至少需4個字元';err.style.display='block';return;}
  if(nw!==cf){err.textContent='兩次輸入不一致';err.style.display='block';return;}
  load(true,'更新密碼中...');
  const res=await POST({action:'changePw',id:CU.id,cur,nw,isAdmin:false});
  load(false);
  if(!res.ok){err.textContent=res.err||'更新失敗';err.style.display='block';return;}
  closeM('m-pw');toast('密碼已更新');
}

// ── 員工入口 ────────────────────────────────────────
async function initStaff(){
  document.getElementById('savtr').textContent=CU.name[0];
  document.getElementById('sname').textContent=CU.name;
  document.getElementById('srole').textContent=(CU.role==='業務'?'業務':'助理')+' · '+CU.id;
  load(true,'載入客戶資料...');
  let res,cfg;
  try {
    [res,cfg] = await Promise.all([
      GET({action:'getMyGifts', email:CU.email, role:CU.role}),
      GET({action:'getConfig'}),
    ]);
  }
  catch(e){
    load(false); toast('網路錯誤：'+e.message);
    document.getElementById('staff-body').innerHTML='<tr><td colspan="18" style="text-align:center;padding:2rem;color:red">API 連線失敗：'+e.message+'</td></tr>';
    return;
  }
  load(false);
  const yr=(cfg&&cfg.ok&&cfg.data&&cfg.data.gift_active_year)||'';
  document.getElementById('s-year').textContent=yr||'全部';
  if(res.ok && res.data){
    GIFTS=res.data;
    if(GIFTS.length===0) toast('未找到屬於您的客戶資料，請確認 Email 欄位與帳號一致');
  } else {
    toast('載入失敗：'+(res.err||'未知錯誤'));
  }
  renderStaff();
}

let STAFF_SORT={key:null,dir:1};
const STAFF_SORT_VAL={
  status:g=>SO[calcStat(g)],
  giftLevel:g=>g.giftLevel||'', itemNo:g=>g.itemNo||'',
  qty:g=>Number(g.qty)||0, price:g=>Number(g.price)||0,
  purpose:g=>g.purpose||'', eventDate:g=>g.eventDate||'',
  withhold:g=>g.withhold||'', recvType:g=>g.recvType||'',
  receiptDate:g=>g.receiptDate||'',
};
function sortStaff(k){
  if(STAFF_SORT.key===k) STAFF_SORT.dir*=-1;
  else { STAFF_SORT.key=k; STAFF_SORT.dir=1; }
  renderStaff();
}
function paintStaffSort(){
  document.querySelectorAll('#pg-staff th.th-sort').forEach(th=>{
    const on=th.dataset.k===STAFF_SORT.key;
    const ic=on?(STAFF_SORT.dir>0?'▲':'▼'):'⇅';
    th.innerHTML=th.dataset.label+` <span style="font-size:10px;opacity:${on?1:.4}">${ic}</span>`;
  });
}
function renderStaff(){
  const q=document.getElementById('sf-q').value.toLowerCase();
  const fp=document.getElementById('sf-p').value;
  const fs=document.getElementById('sf-s').value;
  const data=GIFTS.filter(g=>{
    if(fp!=='全部用途'&&g.purpose!==fp)return false;
    if(fs!=='全部狀態'&&calcStat(g)!==fs)return false;
    if(q&&!(g.customerCode+g.customerName).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>{
    const k=STAFF_SORT.key;
    if(k){
      const va=STAFF_SORT_VAL[k](a), vb=STAFF_SORT_VAL[k](b);
      const c=(typeof va==='number'&&typeof vb==='number')?va-vb:String(va).localeCompare(String(vb),'zh-Hant');
      return c*STAFF_SORT.dir || (SO[calcStat(a)]-SO[calcStat(b)]);
    }
    return SO[calcStat(a)]-SO[calcStat(b)];
  });
  paintStaffSort();
  const done=data.filter(g=>calcStat(g)==='完成').length;
  document.getElementById('s-tot').textContent=data.length;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-pend').textContent=data.length-done;
  const tb=document.getElementById('staff-body');
  if(!data.length){tb.innerHTML='<tr><td colspan="18" style="text-align:center;padding:2rem;color:var(--LT)">無符合條件的記錄</td></tr>';return;}
  tb.innerHTML=data.map(g=>{
    const st=calcStat(g);
    const clCell=g.claimNo
      ?`<span style="font-size:12px">${g.claimNo}</span>`
      :`<span class="cl cl-fill" onclick="openClaim('${g.seq}')">待填寫</span>`;
    const rvCell=g.receiptFile
      ?`<span class="cl" style="cursor:pointer;background:#E6F0FB;color:#0C447C;border-color:#B5CFF0" onclick="dlReceipt('${g.seq}')" title="下載簽收單">⬇ ${g.receiptDate||'待簽收'}</span> <span style="cursor:pointer;color:var(--M);font-size:12px" onclick="openRecv('${g.seq}')" title="修改簽收資料">✎</span>`
      :`<span class="cl cl-up" onclick="openRecv('${g.seq}')">待上傳</span>`;
    return`<tr>
      <td>${sbge(st)}</td>
      <td>${d(g.customerCode)}</td><td>${d(g.taxId)}</td><td style="font-weight:500">${d(g.customerName)}</td>
      <td>${lbge(g.giftLevel)}</td><td>${d(g.itemNo)}</td><td>${d(g.itemDesc)}</td>
      <td>${d(g.qty)}</td><td>${g.price?'$'+Number(g.price).toLocaleString():d('')}</td>
      <td>${pbge(g.purpose)}</td><td>${d(g.eventDate)}</td>
      <td>${clCell}</td><td>${d(g.withhold)}</td>
      <td>${rbge(g.recvType)}</td><td>${d(g.recvName)}</td><td>${d(g.recvId)}</td><td style="max-width:120px">${d(g.recvAddr)}</td>
      <td>${rvCell}</td>
    </tr>`;
  }).join('');
}

// 領用單號
function openClaim(seq){
  EDIT_SEQ=seq;
  const g=GIFTS.find(x=>String(x.seq)===String(seq));
  document.getElementById('cl-name').textContent=g.customerName+(g.group?' ('+g.group+')':'');
  document.getElementById('cl-item').textContent=(g.itemNo||'')+(g.itemDesc?' · '+g.itemDesc:'');
  document.getElementById('cl-input').value=g.claimNo||'';
  openM('m-claim');
}
async function saveClaim(){
  const v=document.getElementById('cl-input').value.trim();
  if(!v){toast('請填寫領用單號');return;}
  load(true,'儲存中...');
  const res=await POST({action:'updateClaim',seq:EDIT_SEQ,claimNo:v,by:CU.id});
  load(false);
  if(!res.ok){toast('錯誤：'+res.err);return;}
  const g=GIFTS.find(x=>String(x.seq)===String(EDIT_SEQ));
  if(g)g.claimNo=v;
  closeM('m-claim');renderStaff();toast('領用單號已儲存');
}

// 簽收資料
function toggleAddr(){
  const t=document.getElementById('rv-type').value;
  document.getElementById('rv-addr-row').style.display=t==='個人'?'block':'none';
}
function selRecvFile(inp){if(inp.files[0]){RECV_FILE=inp.files[0];document.getElementById('rv-flbl').textContent='✓ '+inp.files[0].name;}}
function openRecv(seq){
  EDIT_SEQ=seq;RECV_FILE=null;
  const g=GIFTS.find(x=>String(x.seq)===String(seq));
  document.getElementById('rv-name').textContent=g.customerName+(g.group?' ('+g.group+')':'');
  document.getElementById('rv-item').textContent=(g.itemNo||'')+(g.itemDesc?' · '+g.itemDesc:'');
  document.getElementById('rv-type').value=g.recvType||'';
  document.getElementById('rv-wh').value=g.withhold||'';
  document.getElementById('rv-date').value=g.receiptDate||'';
  document.getElementById('rv-nm').value=g.recvName||'';
  document.getElementById('rv-id').value=g.recvId||'';
  document.getElementById('rv-addr').value=g.recvAddr||'';
  document.getElementById('rv-flbl').textContent=g.receiptFile?'已上傳，選檔可覆蓋':'點擊上傳簽收單';
  toggleAddr();openM('m-recv');
}
async function saveRecv(){
  load(true,'上傳中...');
  const body={
    action:'updateReceipt',seq:EDIT_SEQ,by:CU.id,
    withhold:document.getElementById('rv-wh').value,
    recvType:document.getElementById('rv-type').value,
    recvName:document.getElementById('rv-nm').value,
    recvId:document.getElementById('rv-id').value,
    recvAddr:document.getElementById('rv-addr').value,
    receiptDate:document.getElementById('rv-date').value,
  };
  if(RECV_FILE){
    body.fileBase64=await f2b64(RECV_FILE);
    const ext=RECV_FILE.name.includes('.')?'.'+RECV_FILE.name.split('.').pop():'';
    body.fileName='receipt'+ext;
    body.mimeType=RECV_FILE.type;
  }
  const res=await POST(body);
  load(false);
  if(!res.ok){toast('錯誤：'+res.err);return;}
  const g=GIFTS.find(x=>String(x.seq)===String(EDIT_SEQ));
  if(g){Object.assign(g,body);if(RECV_FILE)g.receiptFile=body.fileName;}
  RECV_FILE=null;closeM('m-recv');renderStaff();toast('簽收資料已儲存');
}

// 下載 / 檢視簽收單
async function dlReceipt(seq){
  load(true,'取得簽收單...');
  let res;
  try{ res=await GET({action:'getReceiptUrl',seq}); }
  catch(e){ load(false); toast('錯誤：'+e.message); return; }
  load(false);
  if(!res.ok||!res.url){ toast('無法取得檔案：'+(res.err||'')); return; }
  window.open(res.url,'_blank');
}
</script>
</body>
